name: CI

on:
    push:
        # Tag pushes are the release workflow's job; this pattern excludes them.
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Kept as three steps so a failure names itself in the UI.
            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            # Also the only check on styles.css: the production build parses it
            # and exits non-zero on a syntax error, which nothing else catches.
            - name: Build
              run: npm run build
